server:
  port: 8080

spring:
  application:
    name: order-center
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_center}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:order123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    # 生产环境必须通过 JWT_SECRET 覆盖，长度至少 32 字节
    jwt-secret: ${JWT_SECRET:order-center-dev-secret-change-me-2026}
    access-token-ttl: 5m
    refresh-token-ttl: 2d
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    default-username: ${AUTH_DEFAULT_USERNAME:admin}
    default-password: ${AUTH_DEFAULT_PASSWORD:admin123}
    default-display-name: ${AUTH_DEFAULT_DISPLAY_NAME:系统管理员}
    default-role: ADMIN
    issuer: order-center
    audience: order-center-web

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.ordercenter: INFO
